<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skeuomorphic Orange Signup</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Trebuchet MS",Arial,sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:
    radial-gradient(circle at top,#fff5ec,#cfcfcf 70%),
    linear-gradient(135deg,#ececec,#b8b8b8);
}

/*==========================
        CARD
==========================*/

.container{

    width:430px;
    padding:40px;

    border-radius:30px;

    background:linear-gradient(#f8f8f8,#d3d3d3);

    border:3px solid #808080;

    box-shadow:
    0 25px 45px rgba(0,0,0,.35),
    inset 0 4px 5px rgba(255,255,255,.9),
    inset 0 -6px 7px rgba(0,0,0,.15),
    0 0 0 8px #efefef,
    0 0 0 11px #808080;
}

/*==========================
        LOGO
==========================*/

.logo{

    width:95px;
    height:95px;

    margin:auto;
    margin-bottom:25px;

    border-radius:50%;

    background:
    linear-gradient(#ffb867,#e67a00);

    border:2px solid #b95d00;

    box-shadow:
    inset 0 4px 6px rgba(255,255,255,.7),
    inset 0 -5px 8px rgba(0,0,0,.25),
    0 10px 18px rgba(0,0,0,.3);

    display:flex;
    justify-content:center;
    align-items:center;

    color:white;
    font-size:40px;
}

/*==========================
        HEADING
==========================*/

h2{

    text-align:center;
    margin-bottom:25px;

    color:#d96d00;

    text-shadow:1px 1px white;
}

/*==========================
        INPUTS
==========================*/

.input-group{

    margin-bottom:18px;
}

label{

    display:block;
    margin-bottom:8px;

    color:#444;
    font-weight:bold;
}

input{

    width:100%;
    padding:14px;

    border-radius:12px;

    border:1px solid #999;

    background:
    linear-gradient(#ffffff,#dddddd);

    font-size:15px;

    outline:none;

    box-shadow:
    inset 0 3px 6px rgba(0,0,0,.18),
    inset 0 -1px 2px rgba(255,255,255,.9),
    0 2px 2px rgba(255,255,255,.8);

    transition:.25s;
}

input:focus{

    background:white;

    border-color:#ff8800;

    box-shadow:
    inset 0 2px 5px rgba(0,0,0,.15),
    0 0 12px rgba(255,136,0,.65);
}

/*==========================
        BUTTON
==========================*/

button{

    width:100%;
    padding:15px;

    margin-top:10px;

    font-size:18px;
    font-weight:bold;

    color:white;

    cursor:pointer;

    border:none;
    border-radius:15px;

    background:
    linear-gradient(#ffb861,#ea7b00);

    box-shadow:
    inset 0 3px 4px rgba(255,255,255,.7),
    inset 0 -5px 6px rgba(0,0,0,.25),
    0 8px 12px rgba(0,0,0,.35);

    transition:.15s;
}

button:hover{

    background:
    linear-gradient(#ffc87b,#ff8d09);
}

button:active{

    transform:translateY(4px);

    box-shadow:
    inset 0 5px 8px rgba(0,0,0,.35),
    0 2px 4px rgba(0,0,0,.3);
}

/*==========================
        MESSAGE
==========================*/

#message{

    margin-top:20px;

    text-align:center;

    font-weight:bold;
}

/*==========================
        FOOTER
==========================*/

.footer{

    margin-top:20px;

    text-align:center;

    color:#555;
}

.footer a{

    color:#d96d00;

    text-decoration:none;

    font-weight:bold;
}

.footer a:hover{

    color:#ff8800;
    text-decoration:underline;
}

</style>
</head>

<body>

<div class="container">

    <div class="logo">👤</div>

    <h2>Create Account</h2>

    <form id="signupForm">

        <div class="input-group">
            <label>Full Name</label>
            <input type="text" id="name" placeholder="Enter your full name">
        </div>

        <div class="input-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="Enter your email">
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter password">
        </div>

        <div class="input-group">
            <label>Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Confirm password">
        </div>

        <button type="submit">Create Account</button>

    </form>

    <p id="message"></p>

    <div class="footer">
        Already have an account?
        <a href="#">Login</a>
    </div>

</div>

<script>

const form = document.getElementById("signupForm");
const message = document.getElementById("message");

form.addEventListener("submit",function(e){

    e.preventDefault();

    let name=document.getElementById("name").value.trim();
    let email=document.getElementById("email").value.trim();
    let password=document.getElementById("password").value;
    let confirm=document.getElementById("confirmPassword").value;

    if(name=="" || email=="" || password=="" || confirm==""){
        message.style.color="red";
        message.innerHTML="Please fill in all the fields.";
        return;
    }

    if(password!==confirm){
        message.style.color="red";
        message.innerHTML="Passwords do not match.";
        return;
    }

    message.style.color="green";
    message.innerHTML="✓ Account created successfully!";

    form.reset();

});

</script>

</body>
</html>
