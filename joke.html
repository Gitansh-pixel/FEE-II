<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Random Joke Generator</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f4f4f9;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }
  .card {
    background: white;
    padding: 2rem 3rem;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    text-align: center;
    max-width: 500px;
  }
  #joke {
    font-size: 1.2rem;
    margin-bottom: 1.5rem;
    min-height: 80px;
  }
  button {
    padding: 0.7rem 1.5rem;
    font-size: 1rem;
    border: none;
    border-radius: 8px;
    background: #4a6cf7;
    color: white;
    cursor: pointer;
  }
  button:hover {
    background: #3a56d4;
  }
</style>
</head>
<body>

<div class="card">
  <div id="joke">Click the button to get a joke!</div>
  <button onclick="getJoke()">Get Joke</button>
</div>

<script>
async function getJoke() {
  const jokeDiv = document.getElementById("joke");
  jokeDiv.textContent = "Loading...";

  try {
    const response = await fetch("https://v2.jokeapi.dev/joke/Any?blacklistFlags=nsfw,racist,sexist,religious,political&type=single,twopart");
    const data = await response.json();

    if (data.error) {
      jokeDiv.textContent = "Couldn't fetch a joke. Try again!";
      return;
    }

    if (data.type === "single") {
      jokeDiv.textContent = data.joke;
    } else {
      jokeDiv.textContent = data.setup + " ... " + data.delivery;
    }
  } catch (err) {
    jokeDiv.textContent = "Something went wrong. Check your connection.";
  }
}
</script>

</body>
</html>
