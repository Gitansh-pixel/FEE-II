<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WXBLOCK — Weather, Bluntly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#111111;
    --paper:#FFF7E6;
    --sun:#FF5A1F;
    --sky:#0057FF;
    --volt:#FFE000;
    --mint:#00C48C;
    --card:#FFFFFF;
    --shadow-offset:7px;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    background:var(--paper);
    background-image:
      radial-gradient(circle, rgba(17,17,17,0.06) 1.5px, transparent 1.5px);
    background-size:22px 22px;
    color:var(--ink);
    font-family:'JetBrains Mono', monospace;
    min-height:100vh;
  }

  h1,h2,h3, .display{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    margin:0;
    letter-spacing:-0.02em;
  }

  .wrap{
    max-width:880px;
    margin:0 auto;
    padding:24px 20px 60px;
  }

  /* ---------- Header ---------- */
  header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:16px;
    flex-wrap:wrap;
    margin-bottom:22px;
  }

  .logo{
    font-size:clamp(28px,5vw,40px);
    display:flex;
    align-items:baseline;
    gap:6px;
  }
  .logo .dot{
    color:var(--sun);
  }
  .tagline{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.14em;
    margin-top:2px;
    opacity:0.75;
  }

  .search-row{
    display:flex;
    gap:10px;
    width:100%;
    max-width:480px;
  }

  input[type="text"]{
    flex:1;
    font-family:'JetBrains Mono', monospace;
    font-size:15px;
    padding:12px 14px;
    border:3px solid var(--ink);
    background:var(--card);
    color:var(--ink);
    box-shadow:4px 4px 0 var(--ink);
    outline:none;
    min-width:0;
  }
  input[type="text"]::placeholder{
    color:#8a8a8a;
  }
  input[type="text"]:focus{
    box-shadow:4px 4px 0 var(--sky);
    border-color:var(--sky);
  }

  button{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:14px;
    border:3px solid var(--ink);
    background:var(--volt);
    color:var(--ink);
    padding:0 16px;
    cursor:pointer;
    box-shadow:4px 4px 0 var(--ink);
    transition:transform 0.08s ease, box-shadow 0.08s ease;
    white-space:nowrap;
  }
  button:active{
    transform:translate(4px,4px);
    box-shadow:0 0 0 var(--ink);
  }
  button:focus-visible, input:focus-visible{
    outline:3px solid var(--sky);
    outline-offset:2px;
  }
  .geo-btn{
    background:var(--mint);
    padding:0 14px;
    font-size:18px;
    line-height:1;
  }

  .status-line{
    font-size:12px;
    margin:10px 2px 0;
    min-height:16px;
  }
  .status-line.error{ color:#B3001B; font-weight:700; }

  /* ---------- Hero ---------- */
  .hero{
    background:var(--card);
    border:4px solid var(--ink);
    box-shadow:var(--shadow-offset) var(--shadow-offset) 0 var(--ink);
    padding:26px;
    margin-bottom:26px;
    position:relative;
    overflow:hidden;
  }
  .hero .place{
    font-size:clamp(20px,4vw,28px);
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .place-badge{
    font-size:10px;
    background:var(--ink);
    color:var(--paper);
    padding:3px 8px;
    letter-spacing:0.08em;
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
  }
  .hero-main{
    display:flex;
    align-items:center;
    gap:22px;
    margin:18px 0 8px;
    flex-wrap:wrap;
  }
  .icon-box{
    flex-shrink:0;
    width:110px;
    height:110px;
  }
  .temp-block{
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .temp-now{
    font-size:clamp(52px,10vw,76px);
    line-height:0.9;
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
  }
  .temp-now sup{
    font-size:0.4em;
    top:-0.6em;
  }
  .condition-label{
    font-size:16px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    font-weight:700;
    background:var(--volt);
    display:inline-block;
    padding:2px 8px;
    border:2px solid var(--ink);
    margin-top:4px;
  }
  .feels-like{
    font-size:12px;
    opacity:0.75;
    margin-top:6px;
  }

  .stat-row{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(110px,1fr));
    gap:10px;
    margin-top:20px;
  }
  .stat{
    border:2px solid var(--ink);
    padding:8px 10px;
    background:var(--paper);
  }
  .stat .label{
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.1em;
    opacity:0.7;
  }
  .stat .value{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:19px;
  }

  /* ---------- Section titles ---------- */
  .section-title{
    display:flex;
    align-items:center;
    gap:10px;
    margin:0 0 12px;
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:0.14em;
  }
  .section-title::after{
    content:"";
    flex:1;
    height:3px;
    background:var(--ink);
  }

  /* ---------- Hourly ---------- */
  .hourly-scroll{
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding-bottom:10px;
    margin-bottom:28px;
    scrollbar-width:thin;
  }
  .hour-card{
    flex:0 0 auto;
    width:78px;
    border:3px solid var(--ink);
    background:var(--card);
    box-shadow:3px 3px 0 var(--ink);
    padding:10px 6px;
    text-align:center;
  }
  .hour-card .h-time{
    font-size:11px;
    font-weight:700;
    opacity:0.8;
  }
  .hour-card svg{ width:34px; height:34px; margin:6px auto; display:block; }
  .hour-card .h-temp{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:16px;
  }

  /* ---------- Daily ---------- */
  .daily-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:10px;
    margin-bottom:20px;
  }
  .day-card{
    border:3px solid var(--ink);
    background:var(--card);
    box-shadow:4px 4px 0 var(--ink);
    padding:12px 8px;
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
  }
  .day-card .d-name{
    font-weight:700;
    font-family:'Space Grotesk', sans-serif;
    font-size:14px;
  }
  .day-card svg{ width:38px; height:38px; margin:4px 0; }
  .day-card .d-hi{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:16px;
  }
  .day-card .d-lo{
    font-size:12px;
    opacity:0.6;
  }
  .day-card .d-rain{
    font-size:10px;
    color:var(--sky);
    font-weight:700;
    margin-top:2px;
  }

  footer{
    text-align:center;
    font-size:11px;
    opacity:0.6;
    margin-top:20px;
  }
  footer a{ color:var(--ink); }

  .skeleton{
    opacity:0.4;
  }

  @media (max-width:640px){
    .daily-grid{ grid-template-columns:repeat(3,1fr); }
    .hero-main{ gap:14px; }
    .icon-box{ width:84px; height:84px; }
  }
  @media (max-width:420px){
    .daily-grid{ grid-template-columns:repeat(2,1fr); }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <div class="logo">WXBLOCK<span class="dot">.</span></div>
      <div class="tagline">weather, stated plainly</div>
    </div>
    <form class="search-row" id="searchForm">
      <input type="text" id="cityInput" placeholder="Enter a city…" autocomplete="off">
      <button type="submit">GO</button>
      <button type="button" class="geo-btn" id="geoBtn" title="Use my location" aria-label="Use my location">⌖</button>
    </form>
  </header>

  <div class="status-line" id="statusLine">Loading Ludhiana…</div>

  <section class="hero" id="hero">
    <div class="place">
      <h1 id="placeName">—</h1>
      <span class="place-badge" id="placeBadge">LOCAL TIME —</span>
    </div>
    <div class="hero-main">
      <div class="icon-box" id="heroIcon"></div>
      <div class="temp-block">
        <div class="temp-now"><span id="tempNow">--</span><sup>°C</sup></div>
        <div class="condition-label" id="conditionLabel">—</div>
        <div class="feels-like" id="feelsLike">Feels like —°</div>
      </div>
    </div>
    <div class="stat-row">
      <div class="stat"><div class="label">Humidity</div><div class="value" id="statHumidity">—%</div></div>
      <div class="stat"><div class="label">Wind</div><div class="value" id="statWind">— km/h</div></div>
      <div class="stat"><div class="label">Rain chance</div><div class="value" id="statRain">—%</div></div>
      <div class="stat"><div class="label">UV-ish High</div><div class="value" id="statHigh">—°</div></div>
    </div>
  </section>

  <div>
    <div class="section-title">NEXT 24H</div>
    <div class="hourly-scroll" id="hourlyScroll"></div>
  </div>

  <div>
    <div class="section-title">5-DAY OUTLOOK</div>
    <div class="daily-grid" id="dailyGrid"></div>
  </div>

  <footer>
    Data via <a href="https://open-meteo.com" target="_blank" rel="noopener">open-meteo.com</a> — no key, no tracking, just numbers.
  </footer>
</div>

<script>
(function(){
  const statusLine = document.getElementById('statusLine');
  const searchForm = document.getElementById('searchForm');
  const cityInput = document.getElementById('cityInput');
  const geoBtn = document.getElementById('geoBtn');

  // ---------- Brutalist icon set (blocky, flat, thick strokes) ----------
  function icon(code, size){
    const s = size || 48;
    const stroke = 'var(--ink)';
    const wrap = (inner) => `<svg viewBox="0 0 64 64" width="${s}" height="${s}" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;

    // Clear / sunny
    if (code === 0) return wrap(`
      <rect x="26" y="4" width="12" height="12" fill="var(--volt)" stroke="${stroke}" stroke-width="3"/>
      <rect x="26" y="48" width="12" height="12" fill="var(--volt)" stroke="${stroke}" stroke-width="3"/>
      <rect x="4" y="26" width="12" height="12" fill="var(--volt)" stroke="${stroke}" stroke-width="3"/>
      <rect x="48" y="26" width="12" height="12" fill="var(--volt)" stroke="${stroke}" stroke-width="3"/>
      <circle cx="32" cy="32" r="14" fill="var(--sun)" stroke="${stroke}" stroke-width="3"/>
    `);
    // Mainly clear / partly cloudy
    if (code === 1 || code === 2) return wrap(`
      <circle cx="24" cy="24" r="12" fill="var(--sun)" stroke="${stroke}" stroke-width="3"/>
      <rect x="14" y="34" width="42" height="18" fill="#fff" stroke="${stroke}" stroke-width="3"/>
      <rect x="24" y="26" width="10" height="10" fill="#fff" stroke="${stroke}" stroke-width="0"/>
    `);
    // Overcast
    if (code === 3) return wrap(`
      <rect x="8" y="26" width="48" height="22" fill="#DDE3EA" stroke="${stroke}" stroke-width="3"/>
      <rect x="18" y="14" width="28" height="16" fill="#DDE3EA" stroke="${stroke}" stroke-width="3"/>
    `);
    // Fog
    if (code === 45 || code === 48) return wrap(`
      <rect x="6" y="18" width="52" height="7" fill="#DDE3EA" stroke="${stroke}" stroke-width="3"/>
      <rect x="14" y="30" width="44" height="7" fill="#DDE3EA" stroke="${stroke}" stroke-width="3"/>
      <rect x="6" y="42" width="36" height="7" fill="#DDE3EA" stroke="${stroke}" stroke-width="3"/>
    `);
    // Drizzle
    if (code >= 51 && code <= 57) return wrap(`
      <rect x="10" y="12" width="44" height="20" fill="#DDE3EA" stroke="${stroke}" stroke-width="3"/>
      <rect x="16" y="40" width="6" height="12" fill="var(--sky)" stroke="${stroke}" stroke-width="2"/>
      <rect x="30" y="40" width="6" height="12" fill="var(--sky)" stroke="${stroke}" stroke-width="2"/>
      <rect x="44" y="40" width="6" height="12" fill="var(--sky)" stroke="${stroke}" stroke-width="2"/>
    `);
    // Rain
    if ((code >= 61 && code <= 67) || (code >= 80 && code <= 82)) return wrap(`
      <rect x="8" y="10" width="48" height="22" fill="#B9C4CE" stroke="${stroke}" stroke-width="3"/>
      <rect x="12" y="38" width="8" height="18" fill="var(--sky)" stroke="${stroke}" stroke-width="2"/>
      <rect x="28" y="38" width="8" height="18" fill="var(--sky)" stroke="${stroke}" stroke-width="2"/>
      <rect x="44" y="38" width="8" height="18" fill="var(--sky)" stroke="${stroke}" stroke-width="2"/>
    `);
    // Snow
    if ((code >= 71 && code <= 77) || code === 85 || code === 86) return wrap(`
      <rect x="8" y="10" width="48" height="20" fill="#DDE3EA" stroke="${stroke}" stroke-width="3"/>
      <rect x="14" y="38" width="8" height="8" fill="#fff" stroke="${stroke}" stroke-width="2"/>
      <rect x="28" y="46" width="8" height="8" fill="#fff" stroke="${stroke}" stroke-width="2"/>
      <rect x="42" y="38" width="8" height="8" fill="#fff" stroke="${stroke}" stroke-width="2"/>
    `);
    // Thunderstorm
    if (code >= 95) return wrap(`
      <rect x="8" y="8" width="48" height="20" fill="#8A8FA3" stroke="${stroke}" stroke-width="3"/>
      <polygon points="34,30 22,50 32,50 26,60 46,38 34,38" fill="var(--volt)" stroke="${stroke}" stroke-width="3"/>
    `);
    // default
    return wrap(`<rect x="10" y="10" width="44" height="44" fill="#DDE3EA" stroke="${stroke}" stroke-width="3"/>`);
  }

  const CONDITION_TEXT = {
    0:'Clear sky', 1:'Mostly clear', 2:'Partly cloudy', 3:'Overcast',
    45:'Fog', 48:'Icy fog',
    51:'Light drizzle', 53:'Drizzle', 55:'Heavy drizzle',
    56:'Freezing drizzle', 57:'Freezing drizzle',
    61:'Light rain', 63:'Rain', 65:'Heavy rain',
    66:'Freezing rain', 67:'Freezing rain',
    71:'Light snow', 73:'Snow', 75:'Heavy snow', 77:'Snow grains',
    80:'Rain showers', 81:'Rain showers', 82:'Violent showers',
    85:'Snow showers', 86:'Snow showers',
    95:'Thunderstorm', 96:'Thunderstorm w/ hail', 99:'Severe thunderstorm'
  };

  function setStatus(msg, isError){
    statusLine.textContent = msg;
    statusLine.classList.toggle('error', !!isError);
  }

  async function geocode(name){
    const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(name)}&count=1&language=en&format=json`;
    const res = await fetch(url);
    if(!res.ok) throw new Error('Geocoding request failed');
    const data = await res.json();
    if(!data.results || !data.results.length) throw new Error(`No place found for "${name}"`);
    return data.results[0];
  }

  async function reverseByCoords(lat, lon){
    // Open-Meteo geocoding has no reverse endpoint, so we label using coords
    return { name:'Your location', latitude:lat, longitude:lon, country:'', admin1:'' };
  }

  async function fetchWeather(lat, lon){
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
      `&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,precipitation` +
      `&hourly=temperature_2m,weather_code,precipitation_probability` +
      `&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max` +
      `&timezone=auto&forecast_days=6`;
    const res = await fetch(url);
    if(!res.ok) throw new Error('Weather request failed');
    return res.json();
  }

  function fmtHour(iso){
    const d = new Date(iso);
    let h = d.getHours();
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12; if(h === 0) h = 12;
    return `${h}${ampm}`;
  }
  function fmtDay(iso){
    const d = new Date(iso + 'T00:00:00');
    return d.toLocaleDateString('en-US', { weekday:'short' }).toUpperCase();
  }

  function render(place, weather){
    const cur = weather.current;
    const code = cur.weather_code;

    document.getElementById('placeName').textContent =
      [place.name, place.admin1, place.country].filter(Boolean).join(', ');
    const now = new Date();
    document.getElementById('placeBadge').textContent =
      'LOCAL ' + now.toLocaleTimeString('en-US', {hour:'2-digit', minute:'2-digit'});

    document.getElementById('heroIcon').innerHTML = icon(code, 110);
    document.getElementById('tempNow').textContent = Math.round(cur.temperature_2m);
    document.getElementById('conditionLabel').textContent = CONDITION_TEXT[code] || 'Unknown';
    document.getElementById('feelsLike').textContent = `Feels like ${Math.round(cur.apparent_temperature)}°`;

    document.getElementById('statHumidity').textContent = `${Math.round(cur.relative_humidity_2m)}%`;
    document.getElementById('statWind').textContent = `${Math.round(cur.wind_speed_10m)} km/h`;
    document.getElementById('statRain').textContent = `${weather.daily.precipitation_probability_max[0] ?? 0}%`;
    document.getElementById('statHigh').textContent = `${Math.round(weather.daily.temperature_2m_max[0])}°`;

    // hourly: next 24h starting from current hour
    const nowIso = weather.current.time;
    const startIdx = Math.max(0, weather.hourly.time.findIndex(t => t >= nowIso));
    const hourlyScroll = document.getElementById('hourlyScroll');
    hourlyScroll.innerHTML = '';
    for(let i = startIdx; i < startIdx + 24 && i < weather.hourly.time.length; i++){
      const card = document.createElement('div');
      card.className = 'hour-card';
      card.innerHTML = `
        <div class="h-time">${fmtHour(weather.hourly.time[i])}</div>
        ${icon(weather.hourly.weather_code[i], 34)}
        <div class="h-temp">${Math.round(weather.hourly.temperature_2m[i])}°</div>
      `;
      hourlyScroll.appendChild(card);
    }

    // daily: 5 days
    const dailyGrid = document.getElementById('dailyGrid');
    dailyGrid.innerHTML = '';
    for(let i = 0; i < 5 && i < weather.daily.time.length; i++){
      const card = document.createElement('div');
      card.className = 'day-card';
      card.innerHTML = `
        <div class="d-name">${i === 0 ? 'TODAY' : fmtDay(weather.daily.time[i])}</div>
        ${icon(weather.daily.weather_code[i], 38)}
        <div class="d-hi">${Math.round(weather.daily.temperature_2m_max[i])}°</div>
        <div class="d-lo">${Math.round(weather.daily.temperature_2m_min[i])}°</div>
        <div class="d-rain">${weather.daily.precipitation_probability_max[i] ?? 0}% rain</div>
      `;
      dailyGrid.appendChild(card);
    }
  }

  async function loadForCity(name){
    setStatus(`Looking up "${name}"…`);
    try{
      const place = await geocode(name);
      const weather = await fetchWeather(place.latitude, place.longitude);
      render(place, weather);
      setStatus(`Showing ${[place.name, place.country].filter(Boolean).join(', ')}`);
    }catch(err){
      setStatus(err.message || 'Something went wrong', true);
    }
  }

  async function loadForCoords(lat, lon){
    setStatus('Fetching weather for your location…');
    try{
      const place = await reverseByCoords(lat, lon);
      const weather = await fetchWeather(lat, lon);
      render(place, weather);
      setStatus('Showing your current location');
    }catch(err){
      setStatus(err.message || 'Something went wrong', true);
    }
  }

  searchForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const val = cityInput.value.trim();
    if(val) loadForCity(val);
  });

  geoBtn.addEventListener('click', () => {
    if(!navigator.geolocation){
      setStatus('Geolocation not supported by this browser', true);
      return;
    }
    setStatus('Requesting location permission…');
    navigator.geolocation.getCurrentPosition(
      (pos) => loadForCoords(pos.coords.latitude, pos.coords.longitude),
      () => setStatus('Location permission denied — search a city instead', true)
    );
  });

  // Initial load
  loadForCity('Ludhiana');
})();
</script>
</body>
</html>
