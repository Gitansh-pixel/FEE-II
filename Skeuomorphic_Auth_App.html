<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skeuomorphic Auth App</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Trebuchet MS,Arial,sans-serif}
body{
height:100vh;display:flex;justify-content:center;align-items:center;
background:radial-gradient(circle at top,#fff5eb,#d7d7d7 65%),linear-gradient(135deg,#efefef,#bdbdbd);
}
.card{
width:430px;padding:35px;border-radius:28px;
background:linear-gradient(#fafafa,#d5d5d5);
border:3px solid #7f7f7f;
box-shadow:0 20px 40px rgba(0,0,0,.35), inset 0 3px 5px rgba(255,255,255,.9), inset 0 -5px 7px rgba(0,0,0,.15),0 0 0 8px #eee;
display:none;
}
.active{display:block}
.logo{
width:90px;height:90px;border-radius:50%;margin:0 auto 20px;
display:flex;justify-content:center;align-items:center;
font-size:40px;color:#fff;
background:linear-gradient(#ffb96d,#ea7b00);
box-shadow:inset 0 3px 4px rgba(255,255,255,.8),inset 0 -4px 6px rgba(0,0,0,.25),0 8px 15px rgba(0,0,0,.3)
}
h2{text-align:center;color:#d96d00;margin-bottom:20px}
label{display:block;margin:12px 0 6px;font-weight:bold;color:#444}
input{
width:100%;padding:13px;border-radius:12px;border:1px solid #999;
background:linear-gradient(#fff,#ddd);
box-shadow:inset 0 2px 5px rgba(0,0,0,.15);
outline:none;
}
input:focus{border-color:#ff8c00;box-shadow:0 0 10px rgba(255,140,0,.5), inset 0 2px 4px rgba(0,0,0,.15)}
button{
width:100%;margin-top:20px;padding:14px;border:none;border-radius:14px;
background:linear-gradient(#ffbb68,#ea7b00);color:#fff;font-size:18px;font-weight:bold;cursor:pointer;
box-shadow:inset 0 2px 3px rgba(255,255,255,.8), inset 0 -4px 6px rgba(0,0,0,.25),0 8px 10px rgba(0,0,0,.3)
}
button:active{transform:translateY(3px)}
.switch{text-align:center;margin-top:18px}
.switch a{color:#d96d00;font-weight:bold;text-decoration:none;cursor:pointer}
.msg{text-align:center;margin-top:15px;font-weight:bold}
.success{text-align:center}
.success .logo{background:linear-gradient(#78dd73,#2da83e)}
.success p{margin:15px 0;color:#555;line-height:1.6}
</style>
</head>
<body>

<div id="signup" class="card active">
<div class="logo">👤</div>
<h2>Sign Up</h2>
<label>Name</label><input id="sname">
<label>Email</label><input id="semail" type="email">
<label>Password</label><input id="spass" type="password">
<label>Confirm Password</label><input id="scpass" type="password">
<button onclick="signup()">Create Account</button>
<div id="smsg" class="msg"></div>
<div class="switch">Already have an account? <a onclick="show('login')">Login</a></div>
</div>

<div id="login" class="card">
<div class="logo">🔐</div>
<h2>Login</h2>
<label>Email</label><input id="lemail" type="email">
<label>Password</label><input id="lpass" type="password">
<button onclick="login()">Login</button>
<div id="lmsg" class="msg"></div>
<div class="switch">Don't have an account? <a onclick="show('signup')">Sign Up</a></div>
</div>

<div id="welcome" class="card success">
<div class="logo">✔</div>
<h2>Welcome</h2>
<p id="welcomeText"></p>
<button onclick="logout()">Logout</button>
</div>

<script>
function show(id){
document.querySelectorAll('.card').forEach(c=>c.classList.remove('active'));
document.getElementById(id).classList.add('active');
}
function users(){return JSON.parse(localStorage.getItem("users")||"[]")}
function save(u){localStorage.setItem("users",JSON.stringify(u));}

function signup(){
let n=sname.value.trim(),e=semail.value.trim(),p=spass.value,c=scpass.value;
let m=document.getElementById("smsg");
if(!n||!e||!p||!c){m.style.color="red";m.textContent="Fill all fields.";return;}
if(p!==c){m.style.color="red";m.textContent="Passwords do not match.";return;}
let arr=users();
if(arr.some(x=>x.email===e)){m.style.color="red";m.textContent="Email already registered.";return;}
arr.push({name:n,email:e,password:p});
save(arr);
m.style.color="green";m.textContent="Signup successful!";
setTimeout(()=>show("login"),800);
}
function login(){
let e=lemail.value.trim(),p=lpass.value;
let m=document.getElementById("lmsg");
let u=users().find(x=>x.email===e && x.password===p);
if(!u){m.style.color="red";m.textContent="Invalid email or password.";return;}
localStorage.setItem("currentUser",JSON.stringify(u));
document.getElementById("welcomeText").innerHTML="Hello <b>"+u.name+"</b><br>You have successfully logged in.";
show("welcome");
}
function logout(){
localStorage.removeItem("currentUser");
show("login");
}
window.onload=()=>{
let u=JSON.parse(localStorage.getItem("currentUser")||"null");
if(u){
document.getElementById("welcomeText").innerHTML="Hello <b>"+u.name+"</b><br>You have successfully logged in.";
show("welcome");
}
}
</script>
</body>
</html>
